[project]
name = "rag-server"
version = "0.2.0"
description = "MCP RAG Server — a feature-complete RAG knowledge base service exposed via MCP protocol"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "rag-server contributors"},
]
keywords = ["rag", "mcp", "llm", "knowledge-base", "rag-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "pymupdf>=1.23.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "dashscope>=1.0.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.9.0",
    "pytesseract>=0.3.10",
    "pdfplumber>=0.10.0",
    "mcp>=1.0.0",
    "streamlit>=1.30.0",
    "python-docx>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/rag-server"
Source = "https://github.com/YOUR_USERNAME/rag-server"
Issues = "https://github.com/YOUR_USERNAME/rag-server/issues"

[project.scripts]
rag-server = "rag_server.__main__:main"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_server", "rag_server.*"]

[tool.setuptools.package-data]
rag_server = ["py.typed"]